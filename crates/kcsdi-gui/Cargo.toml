[package]
name = "kcsdi-gui"
description = "Graphical interface for KC901 instruments (egui)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kcsdi-gui"
path = "src/main.rs"

[dependencies]
kcsdi-core = { path = "../kcsdi-core" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "persistence",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "6.0"
sys-locale = "0.3.2"
log = "0.4"
env_logger = "0.11"
rfd = "0.17"
csv = "1.4"
rust_xlsxwriter = "0.99"

[dev-dependencies]
calamine = "0.36"
tempfile = "3.27"
