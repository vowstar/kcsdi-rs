[package]
name = "kcsdi-cli"
description = "Command-line interface for KC901 instruments"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kcsdi"
path = "src/main.rs"

[dependencies]
kcsdi-core = { path = "../kcsdi-core" }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
log = "0.4"
env_logger = "0.11"
